server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-platform
  datasource:
    # 数据库名：pet_platform，按需修改账号密码
    url: jdbc:mysql://localhost:3306/pet_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/migration.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开发期打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# 自定义业务配置
pet:
  jwt:
    # 密钥请保持足够长度（≥32 字节），生产环境务必更换
    secret: pet-platform-jwt-secret-key-2024-please-change-in-production
    # 有效期（秒） 86400 = 24小时
    expire: 86400
  upload:
    # 上传文件本地目录
    path: ./uploads/
    # 静态资源访问前缀（与 WebMvcConfig 配合）
    url-prefix: /uploads
  ai:
    # 识别提供方：mock / baidu
    provider: mock
    # 聊天提供方：mock（关键词养护知识库）/ 后续可扩展真实大模型
    chat:
      provider: mock
    baidu:
      api-key: 
      secret-key: 

logging:
  level:
    com.pet.platform: debug
    org.springframework: info
